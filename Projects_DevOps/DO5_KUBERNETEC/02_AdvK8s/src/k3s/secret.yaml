# secret.yaml
# Secret хранит чувствительные данные: логин/пароль БД, учётные данные
# RabbitMQ, UUID-ключи межсервисной авторизации (gateway-service.uuid,
# booking-service.uuid) и пару RSA-ключей (privateKey/publicKey),
# которыми session-service подписывает JWT-токены, а остальные сервисы
# ими же эти токены проверяют. Все значения найдены в application.properties.
#
# Используем поле stringData — значения пишутся ОБЫЧНЫМ текстом,
# а Kubernetes сам закодирует их в base64 и положит в .data при сохранении
# объекта в etcd. Проверить (после apply) можно так же, как указано в задании:
#   kubectl get secret app-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 --decode

apiVersion: v1                     # версия API для объекта Secret
kind: Secret                       # тип объекта — секрет
metadata:
  name: app-secret                 # имя секрета, на которое ссылаются поды (envFrom/secretKeyRef)
type: Opaque                       # "непрозрачный" тип — произвольный набор пар ключ-значение (в отличие от tls, docker-registry и т.п.)
stringData:                        # значения в виде обычного текста (Kubernetes закодирует их сам)

  # --- Учётные данные PostgreSQL ---
  # используются во всех сервисах: spring.datasource.username / spring.datasource.password
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # --- Учётные данные RabbitMQ ---
  # используются в booking-service и report-service: spring.rabbitmq.username / spring.rabbitmq.password
  RABBIT_MQ_USER: "guest"
  RABBIT_MQ_PASSWORD: "guest"

  # --- Ключи межсервисной авторизации ---
  # каждый сервис проверяет, что запрос пришёл от "своего" gateway/booking
  # сервиса, сравнивая эти UUID (gateway-service.uuid, booking-service.uuid)
  GATEWAY_SERVICE_UUID: "b51ceda2-bfa5-11eb-8529-0242ac130003"   # значение gateway-service.uuid из application.properties
  BOOKING_SERVICE_UUID: "911ccb4c-c055-11eb-8529-0242ac130003"   # значение booking-service.uuid из application.properties

  # --- RSA-ключи для подписи/проверки JWT-токенов сессии ---
