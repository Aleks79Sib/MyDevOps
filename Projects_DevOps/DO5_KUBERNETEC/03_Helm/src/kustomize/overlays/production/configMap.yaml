# configmap.yaml
# ConfigMap хранит НЕсекретные настройки — хосты и порты, к которым
# приложения будут обращаться по сети внутри кластера Kubernetes.
# Значения берутся из переменных ${...}, которые встречаются во всех
# application.properties сервисов (POSTGRES_HOST, SESSION_SERVICE_HOST и т.д.)

apiVersion: v1 
kind: ConfigMap # тип объекта — карта конфигурации (набор пар ключ-значение)
metadata:
  name: app-config # имя ConfigMap, по которому на него будут ссылаться поды (envFrom/configMapKeyRef)
data:  # сам набор конфигурационных пар ключ-значение (только строки)

  # --- PostgreSQL ---
  POSTGRES_HOST: "postgres" 
  POSTGRES_PORT: "5432"

  # --- RabbitMQ (используется booking-service как producer, report-service как consumer) ---
  RABBIT_MQ_HOST: "rabbitmq"
  RABBIT_MQ_PORT: "5672"
  RABBIT_MQ_QUEUE_NAME: "statistics-queue" # имя очереди — должно совпадать у producer и consumer
  RABBIT_MQ_EXCHANGE: "statistics-exchange" # имя fanout-обменника — должно совпадать у producer и consumer

  # Адреса сервисного взаимодействия (используются в gateway-service и booking-service)
  SESSION_SERVICE_HOST: "session-service"
  SESSION_SERVICE_PORT: "8081"

  HOTEL_SERVICE_HOST: "hotel-service"
  HOTEL_SERVICE_PORT: "8082"

  BOOKING_SERVICE_HOST: "booking-service"
  BOOKING_SERVICE_PORT: "8083"

  PAYMENT_SERVICE_HOST: "payment-service"
  PAYMENT_SERVICE_PORT: "8084"

  LOYALTY_SERVICE_HOST: "loyalty-service"
  LOYALTY_SERVICE_PORT: "8085"

  REPORT_SERVICE_HOST: "report-service"
  REPORT_SERVICE_PORT: "8086"

  GATEWAY_SERVICE_HOST: "gateway-service"
  GATEWAY_SERVICE_PORT: "8087"
