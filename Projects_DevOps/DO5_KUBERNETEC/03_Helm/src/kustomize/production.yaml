apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  ports:
  - port: 8083
    targetPort: 8083
  selector:
    app: booking-service
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  ports:
  - port: 8087
    targetPort: 8087
  selector:
    app: gateway-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
spec:
  ports:
  - port: 8082
    targetPort: 8082
  selector:
    app: hotel-service
---
apiVersion: v1
kind: Service
metadata:
  name: loyalty-service
spec:
  ports:
  - port: 8085
    targetPort: 8085
  selector:
    app: loyalty-service
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  ports:
  - port: 8084
    targetPort: 8084
  selector:
    app: payment-service
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
spec:
  ports:
  - port: 8086
    targetPort: 8086
  selector:
    app: report-service
---
apiVersion: v1
kind: Service
metadata:
  name: session-service
spec:
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: session-service
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: reservations_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/booking-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: booking-service
        ports:
        - containerPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/gateway-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: gateway-service
        ports:
        - containerPort: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-service
  template:
    metadata:
      labels:
        app: hotel-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: hotels_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/hotel-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: hotel-service
        ports:
        - containerPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loyalty-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loyalty-service
  template:
    metadata:
      labels:
        app: loyalty-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: balances_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/loyalty-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: loyalty-service
        ports:
        - containerPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: payments_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/payment-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: payment-service
        ports:
        - containerPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: app-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: app-secret
        - name: POSTGRES_DB
          value: postgres
        image: postgres:15
        name: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: init-script
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
      volumes:
      - configMap:
          name: postgres-init
        name: init-script
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              key: RABBIT_MQ_USER
              name: app-secret
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              key: RABBIT_MQ_PASSWORD
              name: app-secret
        image: rabbitmq:3-management
        name: rabbitmq
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: statistics_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/report-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: report-service
        ports:
        - containerPort: 8086
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: users_db
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        image: username/session-service:v3.do10_1.0
        imagePullPolicy: IfNotPresent
        name: session-service
        ports:
        - containerPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: app.k8s.local
    http:
      paths:
      - backend:
          service:
            name: session-service
            port:
              number: 8081
        path: /api/v1/auth
        pathType: Prefix
      - backend:
          service:
            name: gateway-service
            port:
              number: 8087
        path: /api/v1/gateway
        pathType: Prefix
  tls:
  - hosts:
    - app.k8s.local
    secretName: wildcard-k8s-local-tls
