apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - app.k8s.local
      secretName: wildcard-k8s-local-tls

  rules:
    - host: app.k8s.local
      http:
        paths:

          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: session-service
                port:
                  number: 8081

          - path: /api/v1/gateway
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8087