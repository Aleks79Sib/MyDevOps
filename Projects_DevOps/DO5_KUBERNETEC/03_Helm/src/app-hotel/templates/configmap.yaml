apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_HOST: "{{ .Values.config.postgres.host }}"
  POSTGRES_PORT: "{{ .Values.config.postgres.port }}"

  RABBIT_MQ_HOST: "{{ .Values.config.rabbitmq.host }}"
  RABBIT_MQ_PORT: "{{ .Values.config.rabbitmq.port }}"
  RABBIT_MQ_QUEUE_NAME: "{{ .Values.config.rabbitmq.queueName }}"
  RABBIT_MQ_EXCHANGE: "{{ .Values.config.rabbitmq.exchange }}"

  {{- range $name, $service := .Values.services }}
  {{- $envName := upper (replace "-" "_" $name) }}
  {{ $envName }}_HOST: "{{ $name }}"
  {{ $envName }}_PORT: "{{ $service.service.port }}"
  {{- end }}