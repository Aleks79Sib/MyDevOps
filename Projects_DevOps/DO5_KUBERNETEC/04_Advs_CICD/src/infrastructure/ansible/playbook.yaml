- name: Prepare all Kubernetes nodes
  hosts: k3s_cluster
  become: true

  roles:
    - common

- name: Install K3s server
  hosts: k3s_server
  become: true

  roles:
    - k3s_server


- name: Install K3s agents
  hosts: k3s_agents
  become: true

  roles:
    - k3s_agent

- name: Configure kubeconfig
  hosts: k3s_server
  become: true

  roles:
    - kubeconfig

- name: Verify Kubernetes cluster
  hosts: k3s_server
  become: true

  tasks:
    - name: Get Kubernetes nodes
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: kubernetes_nodes
      changed_when: false

    - name: Display Kubernetes nodes
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout

    - name: Get Kubernetes pods
      ansible.builtin.command:
        cmd: k3s kubectl get pods -A
      register: kubernetes_pods
      changed_when: false

    - name: Display Kubernetes pods
      ansible.builtin.debug:
        var: kubernetes_pods.stdout