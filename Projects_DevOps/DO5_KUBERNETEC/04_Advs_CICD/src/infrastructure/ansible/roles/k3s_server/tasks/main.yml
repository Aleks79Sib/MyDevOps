---
- name: Check whether K3s server is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_binary

- name: Install K3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_server_binary.stat.exists

- name: Ensure K3s server is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for K3s node token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token

- name: Show K3s server status
  ansible.builtin.command:
    cmd: k3s kubectl get nodes -o wide
  register: k3s_nodes
  changed_when: false

- name: Display K3s nodes
  ansible.builtin.debug:
    var: k3s_nodes.stdout