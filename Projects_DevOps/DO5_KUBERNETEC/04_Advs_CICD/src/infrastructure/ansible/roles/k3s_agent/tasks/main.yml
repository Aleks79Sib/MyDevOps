---
- name: Check whether K3s agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-agent
  register: k3s_agent_binary

- name: Install K3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL=https://{{ hostvars['shop-master']['ansible_host'] }}:6443 \
      K3S_TOKEN="{{ hostvars['shop-master']['k3s_node_token']['content'] | b64decode | trim }}" \
      sh -
  args:
    creates: /usr/local/bin/k3s-agent
  when: not k3s_agent_binary.stat.exists

- name: Ensure K3s agent is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started