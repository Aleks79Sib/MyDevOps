{{- if .Values.elasticsearch.enabled }}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.elasticsearch.persistence.size }}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
spec:
  serviceName: elasticsearch
  replicas: {{ .Values.elasticsearch.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch

  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch

    spec:
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP

          env:
            - name: discovery.type
              value: "single-node"

            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

            - name: xpack.security.enabled
              value: "false"

          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}

      volumes:
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc

{{- end }}