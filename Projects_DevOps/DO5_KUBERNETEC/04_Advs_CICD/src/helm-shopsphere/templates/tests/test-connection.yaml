apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "shopsphere.fullname" . }}-test-connection"
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - "-qO-"
        - "http://api-gateway:8080/actuator/health"