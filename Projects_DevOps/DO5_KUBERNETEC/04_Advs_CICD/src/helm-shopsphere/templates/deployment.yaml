{{- range $serviceName, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
  labels:
    {{- include "shopsphere.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $serviceName }}
spec:
  replicas: {{ $service.replicas }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serviceName }}
      app.kubernetes.io/instance: {{ $.Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $serviceName }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $serviceName }}

    spec:
      imagePullSecrets:
        {{ toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      containers:
        - name: {{ $serviceName }}
          image: {{ include "shopsphere.image" (dict "root" $ "service" $service) }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "shopsphere.fullname" $ }}-config
            - secretRef:
                name: {{ $.Values.secrets.existingSecret }}

          resources:
            {{- toYaml $.Values.resources.default | nindent 12 }}

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
{{- end }}