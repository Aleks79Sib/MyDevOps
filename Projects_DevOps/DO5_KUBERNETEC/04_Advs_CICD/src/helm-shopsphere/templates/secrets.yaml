{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGODB_USERNAME: {{ required "secrets.mongodbUsername is required when secrets.create=true" .Values.secrets.mongodbUsername | quote }}
  MONGODB_PASSWORD: {{ required "secrets.mongodbPassword is required when secrets.create=true" .Values.secrets.mongodbPassword | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.create=true" .Values.secrets.jwtSecret | quote }}
  STRIPE_SECRET_KEY: {{ required "secrets.stripeSecretKey is required when secrets.create=true" .Values.secrets.stripeSecretKey | quote }}
  ELASTICSEARCH_USERNAME: {{ required "secrets.elasticsearchUsername is required when secrets.create=true" .Values.secrets.elasticsearchUsername | quote }}
  ELASTICSEARCH_PASSWORD: {{ required "secrets.elasticsearchPassword is required when secrets.create=true" .Values.secrets.elasticsearchPassword | quote }}
  MAIL_USERNAME: {{ default "" .Values.secrets.mailUsername | quote }}
  MAIL_PASSWORD: {{ default "" .Values.secrets.mailPassword | quote }}
{{- end }}