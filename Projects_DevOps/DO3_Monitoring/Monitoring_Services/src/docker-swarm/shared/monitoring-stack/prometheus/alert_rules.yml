groups:
  - name: critical_alerts
    rules:
      # 1. Доступная память меньше 100 Мб
      - alert: LowAvailableMemory
        expr: node_memory_MemAvailable_bytes < 100 * 1024 * 1024
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Доступная память меньше 100 Мб на {{ $labels.instance }}"
          description: "Свободной RAM осталось {{ $value | humanize1024 }}Б на {{ $labels.instance }}"

      # 2. Затраченная RAM больше 1 Гб
      - alert: HighUsedMemory
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) > 1 * 1024 * 1024 * 1024
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Затраченная RAM больше 1 Гб на {{ $labels.instance }}"

      # 3. Использование CPU по сервису превышает 10%
      - alert: HighServiceCPU
        expr: sum(rate(container_cpu_usage_seconds_total{name!=""}[5m])) by (name) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Использование CPU сервисом {{ $labels.name }} превышает 10%"

      # 4. Сервис недоступен (пример дополнительного полезного правила)
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} (job {{ $labels.job }}) недоступен более 1 минуты"
