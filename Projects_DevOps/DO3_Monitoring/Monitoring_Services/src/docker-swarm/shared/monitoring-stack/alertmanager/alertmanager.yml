global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'combined-notifications'

receivers:
  - name: 'combined-notifications'
    email_configs:
      - to: 'user@test.com'
        from: 'user@test.com'
        smarthost: 'smtp.test.com:465'
        auth_username: 'user@test.com'
        auth_password: 'zzzzzzzzzzzzzzzz'
        require_tls: true
    telegram_configs:
      - bot_token: 'zzzzzzzzzzzzzzzzzzz'
        api_url: 'https://api.telegram.org'
        chat_id: 'ваш_user_id'
        parse_mode: 'HTML'
        message: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
